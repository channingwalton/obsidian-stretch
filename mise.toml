# CI installs these, so it builds with the same Node as local.
[tools]
node = "26.12.0"

[tasks.default]
description = "List available tasks"
run = "mise tasks ls --local --extended"

[tasks.clean]
description = "Remove the built plugin"
run = "rm -f main.js"

[tasks.commit-check]
alias = "cc"
description = "Clean, install dependencies, typecheck, test and build"
depends = ["clean"]
run = [
    "npm ci",
    "npm run typecheck",
    "npm test",
    "npm run build",
]

[tasks.bump]
description = "Bump the version in package.json and manifest.json"
usage = '''
arg "<level>" help="Which part of the version to bump" {
  choices "major" "minor" "patch"
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
# npm also keeps package-lock.json's copy of the version in step.
version=$(npm version "$usage_level" --no-git-tag-version | tr -d v)
manifest=$(jq --arg v "$version" '.version = $v' manifest.json)
printf '%s\n' "$manifest" > manifest.json
echo "==> bumped to $version; commit it, then mise run release"
'''

[tasks.release]
description = "Check, then tag and push the manifest version for the Release workflow to publish"
usage = 'flag "--notes <file>" help="Release notes file; GitHub generates them when omitted"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=$(jq -r .version manifest.json)
# Obsidian finds a release by the manifest version as the tag, with no v prefix.
if git rev-parse -q --verify "refs/tags/$version" >/dev/null \
    || [ -n "$(git ls-remote --tags origin "refs/tags/$version")" ]; then
    echo "error: tag $version already exists; bump the version in manifest.json first" >&2
    exit 1
fi
if [ "$(jq -r .version package.json)" != "$version" ]; then
    echo "error: package.json and manifest.json disagree on the version" >&2
    exit 1
fi
if [ "$(git branch --show-current)" != main ]; then
    echo "error: release from main" >&2
    exit 1
fi
# The tag must point at a commit holding exactly what is released.
if [ -n "$(git status --porcelain)" ]; then
    echo "error: the working tree has uncommitted changes" >&2
    exit 1
fi
mise run commit-check
if [ -n "${usage_notes:-}" ]; then
    # The Release workflow reads the notes from the tag. whitespace keeps lines starting
    # with #, which git strips by default, so Markdown headings survive.
    git tag --annotate --cleanup=whitespace --file "$usage_notes" "$version"
else
    git tag "$version"
fi
# --atomic: the tag starts the release, so it must not land if main is rejected.
git push --atomic origin main "$version"
echo "==> pushed $version; GitHub Actions now builds and publishes it: gh run list --workflow release.yml"
'''
